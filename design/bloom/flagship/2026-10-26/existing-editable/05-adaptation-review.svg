<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844"><rect width="390" height="844" fill="#F7FAF8"/><rect width="390" height="96" fill="#2563A6"/><text x="22" y="35" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">bloom</text><text x="22" y="70" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700">Review plan change</text><text x="22" y="117" fill="#50645B" font-family="Arial, sans-serif" font-size="13" font-weight="400">Athlete approves every material revision</text><rect x="18" y="138" width="354" height="111" rx="19" fill="#FFFFFF" stroke="#E0E7E2"/><text x="34" y="166" fill="#2563A6" font-family="Arial, sans-serif" font-size="12" font-weight="700">PROPOSED CHANGE · NOT APPLIED</text><text x="34" y="194" fill="#20352B" font-family="Arial, sans-serif" font-size="17" font-weight="700">Thursday intervals → Easy run</text><text x="34" y="224" fill="#60717C" font-family="Arial, sans-serif" font-size="12" font-weight="400">Only if approved by you</text><rect x="18" y="266" width="354" height="133" rx="19" fill="#FFFFFF" stroke="#E0E7E2"/><text x="34" y="297" fill="#20352B" font-family="Arial, sans-serif" font-size="13" font-weight="700">WHY SUGGESTED?</text><text x="34" y="326" fill="#20352B" font-family="Arial, sans-serif" font-size="12" font-weight="400">You reported a demanding session yesterday.</text><text x="34" y="351" fill="#20352B" font-family="Arial, sans-serif" font-size="12" font-weight="400">Missing: sleep and wearable measurements.</text><text x="34" y="377" fill="#60717C" font-family="Arial, sans-serif" font-size="11" font-weight="400">No injury-risk estimate is implied.</text><rect x="18" y="415" width="354" height="151" rx="19" fill="#FFFFFF" stroke="#E0E7E2"/><text x="34" y="445" fill="#60717C" font-family="Arial, sans-serif" font-size="11" font-weight="700">BEFORE</text><text x="34" y="470" fill="#20352B" font-family="Arial, sans-serif" font-size="16" font-weight="700">Intervals · 45 min</text><text x="34" y="508" fill="#60717C" font-family="Arial, sans-serif" font-size="11" font-weight="700">AFTER (PROPOSED)</text><text x="34" y="533" fill="#20352B" font-family="Arial, sans-serif" font-size="16" font-weight="700">Easy run · 30 min</text><rect x="18" y="581" width="354" height="87" rx="19" fill="#FFFFFF" stroke="#E0E7E2"/><text x="34" y="612" fill="#20352B" font-family="Arial, sans-serif" font-size="13" font-weight="400">Keep original plan or edit this proposal.</text><text x="34" y="640" fill="#60717C" font-family="Arial, sans-serif" font-size="11" font-weight="400">Prior plan/history will remain available.</text><rect x="18" y="688" width="354" height="48" rx="15" fill="#2563A6"/><text x="34" y="718" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" font-weight="700">Accept proposed change</text><rect x="18" y="747" width="172" height="48" rx="14" fill="white" stroke="#B9CEDF"/><text x="47" y="778" fill="#2563A6" font-family="Arial, sans-serif" font-size="14" font-weight="700">Keep original</text><rect x="200" y="747" width="172" height="48" rx="14" fill="white" stroke="#B9CEDF"/><text x="264" y="778" fill="#2563A6" font-family="Arial, sans-serif" font-size="14" font-weight="700">Edit</text></svg>