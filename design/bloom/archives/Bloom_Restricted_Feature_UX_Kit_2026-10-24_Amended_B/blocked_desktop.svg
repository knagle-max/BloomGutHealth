<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-label="Bloom restricted feature design concept"><rect width="1000" height="800" fill="#F5F8F7"/><rect x="25" y="25" width="950" height="72" rx="16" fill="white" stroke="#DCE7DF"/><text x="48" y="71" font-size="27" font-family="Arial" font-weight="bold" fill="#246B50">Bloom  /  Authorized Development Review</text><text x="32" y="145" font-size="30" font-family="Arial" font-weight="bold" fill="#1E3B32">Access restricted</text><rect x="32" y="188" width="935" height="185" rx="16" fill="white" stroke="#DCE7DF"/><text x="56" y="237" font-size="24" font-family="Arial" font-weight="bold" fill="#1E3B32">This capability is not available in this environment</text><text x="56" y="278" font-size="18" font-family="Arial" fill="#50665A">Restricted features require independent authorization and approval.</text><text x="56" y="317" font-size="17" font-family="Arial" fill="#50665A">Return to supported Bloom tools. Your existing entries are unchanged.</text><rect x="56" y="335" width="238" height="1" fill="#DCE7DF"/><rect x="32" y="410" width="935" height="130" rx="15" fill="#FBE9EA"/><text x="56" y="453" font-size="19" font-family="Arial" font-weight="bold" fill="#9B3F43">Incident-disabled means no preview access</text><text x="56" y="488" font-size="17" font-family="Arial" fill="#66494A">Do not show generated result, cached data, download links or hidden output.</text><text x="32" y="760" font-size="14" font-family="Arial" fill="#6F8077">Editable Bloom design reference · not an implemented access-control surface</text></svg>