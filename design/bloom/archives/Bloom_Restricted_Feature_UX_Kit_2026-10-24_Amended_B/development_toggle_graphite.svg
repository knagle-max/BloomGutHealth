<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="t d"><title id="t">Bloom internal development toggle design</title><desc id="d">Graphite toggle only for authorized testers. Two permitted previews have explicit approval category labels. Incident-disabled features remain unavailable.</desc><rect width="900" height="550" fill="#F4F6F7"/><rect x="34" y="34" width="832" height="483" rx="22" fill="white" stroke="#D5DADE"/><text x="65" y="84" fill="#222D37" font-size="28" font-family="Arial" font-weight="700">Bloom · Internal development tools</text><text x="65" y="116" fill="#596670" font-size="16" font-family="Arial">Authorized reviewer · Synthetic data only</text><rect x="62" y="147" width="776" height="89" rx="14" fill="#F1F2F3"/><text x="84" y="183" fill="#252B32" font-size="20" font-family="Arial" font-weight="700">Show development features</text><text x="84" y="210" fill="#56616A" font-size="15" font-family="Arial">Displays only features approved for your tester role and environment.</text><rect x="736" y="165" width="74" height="43" rx="22" fill="#343B43"/><circle cx="785" cy="186.5" r="16" fill="white"/><text x="747" y="223" font-size="12" font-family="Arial" fill="#343B43">ON</text><text x="65" y="274" fill="#424E59" font-size="14" font-family="Arial" font-weight="700">DEV ONLY — NOT APPROVED FOR PUBLIC RELEASE</text><rect x="63" y="292" width="774" height="80" rx="12" fill="white" stroke="#DAE0E5"/><text x="83" y="322" fill="#27323D" font-size="19" font-family="Arial" font-weight="700">AI food photo analysis</text><text x="83" y="348" fill="#626F79" font-size="15" font-family="Arial">Not approved for public users</text><rect x="570" y="312" width="248" height="38" rx="19" fill="#FFF2DC"/><text x="588" y="336" font-size="15" font-family="Arial" fill="#845311">Dev only · pending approval</text><rect x="63" y="384" width="774" height="80" rx="12" fill="white" stroke="#DAE0E5"/><text x="83" y="414" fill="#27323D" font-size="19" font-family="Arial" font-weight="700">Microbial flux model</text><text x="83" y="442" fill="#626F79" font-size="15" font-family="Arial">Synthetic-model research; not measured biology</text><rect x="586" y="405" width="232" height="38" rx="19" fill="#F0EBF9"/><text x="601" y="429" font-size="15" font-family="Arial" fill="#584484">Internal research only</text><text x="65" y="494" font-size="14" fill="#66717B" font-family="Arial">Incident-disabled capabilities cannot be revealed by this switch.</text></svg>