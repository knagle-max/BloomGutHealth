<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-label="Bloom restricted feature design concept"><rect width="1000" height="800" fill="#F5F8F7"/><rect x="25" y="25" width="950" height="72" rx="16" fill="white" stroke="#DCE7DF"/><text x="48" y="71" font-size="27" font-family="Arial" font-weight="bold" fill="#246B50">Bloom  /  Authorized Development Review</text><text x="32" y="150" font-size="30" font-family="Arial" font-weight="bold" fill="#1E3B32">Development feature preview</text><rect x="32" y="180" width="935" height="100" rx="15" fill="#FFF2DC"/><text x="52" y="218" font-size="19" font-family="Arial" font-weight="bold" fill="#875615">DEV ONLY — NOT APPROVED FOR PUBLIC RELEASE</text><text x="52" y="248" font-size="16" font-family="Arial" fill="#614F36">Synthetic data only · server authorization required · no clinical or research authorization</text><rect x="32" y="309" width="935" height="180" rx="15" fill="white" stroke="#DCE7DF"/><text x="52" y="355" font-size="22" font-family="Arial" font-weight="bold" fill="#243C33">Preview: advanced response model</text><text x="52" y="394" font-size="16" font-family="Arial" fill="#56695F">Model not validated for personal predictions. Forecasts unavailable.</text><text x="52" y="439" font-size="16" font-family="Arial" fill="#945B13">Outstanding: scientific validation · Legal · Security · User Testing</text><rect x="32" y="520" width="935" height="99" rx="15" fill="#F0EBF9"/><text x="52" y="563" font-size="18" font-family="Arial" font-weight="bold" fill="#67539A">RESEARCH ONLY</text><text x="52" y="593" font-size="16" font-family="Arial" fill="#403A4F">Microbial flux sandbox uses test data; not observed metabolites.</text><text x="32" y="760" font-size="14" font-family="Arial" fill="#6F8077">Editable Bloom design reference · not an implemented access-control surface</text></svg>