s</text><text x="34" y="724" font-family="Arial" font-size="14" fill="#53675E">Always available without linking accounts</text><text x="34" y="762" font-family="Arial" font-size="15" font-weight="bold" fill="#246B50">Add measurement  →</text><text x="24" y="849" font-family="Arial" font-size="12" fill="#667D73">Synthetic wireframe · no live status or measurements</text></svg>