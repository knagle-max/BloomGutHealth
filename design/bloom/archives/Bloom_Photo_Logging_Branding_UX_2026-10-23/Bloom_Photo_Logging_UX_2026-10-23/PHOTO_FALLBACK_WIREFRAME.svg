<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 670" role="img" aria-label="Bloom packaged food and image failure mobile recovery wireframe"><rect width="390" height="670" fill="#F5F9F7"/><text x="22" y="50" font-family="Arial" font-size="25" fill="#246B50" font-weight="bold">Bloom · Find your food</text><rect x="16" y="78" width="358" height="153" rx="16" fill="white" stroke="#D8E4DB"/><text x="33" y="113" font-size="20" font-family="Arial" font-weight="bold" fill="#182C24">We couldn't confirm this food</text><text x="33" y="145" font-size="14" font-family="Arial" fill="#50665A">The photo alone can't verify the exact</text><text x="33" y="164" font-size="14" font-family="Arial" fill="#50665A">product, serving or hidden ingredients.</text><text x="33" y="205" font-size="14" font-family="Arial" fill="#246B50">Your draft is unchanged.</text><rect x="16" y="251" width="358" height="77" rx="12" fill="white" stroke="#D8E4DB"/><text x="30" y="280" font-family="Arial" font-size="17" font-weight="bold" fill="#182C24">Scan package barcode</text><text x="30" y="304" font-family="Arial" font-size="13" fill="#50665A">Find the precise product and variant</text><text x="349" y="291" font-family="Arial" font-size="21" fill="#246B50">›</text><rect x="16" y="340" width="358" height="77" rx="12" fill="white" stroke="#D8E4DB"/><text x="30" y="369" font-family="Arial" font-size="17" font-weight="bold" fill="#182C24">Enter nutrition label</text><text x="30" y="393" font-family="Arial" font-size="13" fill="#50665A">Copy serving and nutrients from packaging</text><text x="349" y="380" font-family="Arial" font-size="21" fill="#246B50">›</text><rect x="16" y="429" width="358" height="77" rx="12" fill="white" stroke="#D8E4DB"/><text x="30" y="458" font-family="Arial" font-size="17" font-weight="bold" fill="#182C24">Type a food or recipe</text><text x="30" y="482" font-family="Arial" font-size="13" fill="#50665A">Use manual logging without camera</text><text x="349" y="469" font-family="Arial" font-size="21" fill="#246B50">›</text><rect x="16" y="518" width="358" height="77" rx="12" fill="white" stroke="#D8E4DB"/><text x="30" y="547" font-family="Arial" font-size="17" font-weight="bold" fill="#182C24">Use a generic estimate</text><text x="30" y="571" font-family="Arial" font-size="13" fill="#50665A">Clearly marked as incomplete, editable</text><text x="349" y="558" font-family="Arial" font-size="21" fill="#246B50">›</text></svg>