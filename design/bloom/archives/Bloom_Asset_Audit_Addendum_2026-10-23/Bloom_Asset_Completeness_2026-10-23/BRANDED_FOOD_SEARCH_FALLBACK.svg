<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 740"><rect width="890" height="740" fill="#F5FAF7"/><text x="40" y="52" fill="#246B50" font-family="Arial" font-size="29" font-weight="700">Bloom Everyday · Search fallback</text><text x="40" y="80" fill="#5A6D65" font-family="Arial" font-size="15">Illustrative UX wireframe · no real product lookup</text><rect x="40" y="115" width="810" height="100" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="57" y="144" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Find a packaged food</text><text x="57" y="170" fill="#51695E" font-family="Arial" font-size="14">Your search: kit kit bar</text><rect x="40" y="237" width="810" height="104" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="57" y="266" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Did you mean KitKat?</text><text x="57" y="292" fill="#51695E" font-family="Arial" font-size="14">Check the name and exact package before saving.</text><rect x="40" y="365" width="390" height="96" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="57" y="394" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Scan a barcode</text><text x="57" y="420" fill="#51695E" font-family="Arial" font-size="14">Use camera if permission is granted</text><rect x="460" y="365" width="390" height="96" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="477" y="394" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Enter a nutrition label</text><text x="477" y="420" fill="#51695E" font-family="Arial" font-size="14">Copy calories and nutrients from package</text><rect x="40" y="480" width="390" height="96" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="57" y="509" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Manual food entry</text><text x="57" y="535" fill="#51695E" font-family="Arial" font-size="14">Enter a portion and available nutrients</text><rect x="460" y="480" width="390" height="96" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="477" y="509" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Use a generic estimate</text><text x="477" y="535" fill="#51695E" font-family="Arial" font-size="14">Clearly labelled approximation, not exact product</text><rect x="40" y="600" width="810" height="100" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="57" y="629" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Preserve search and edits</text><text x="57" y="655" fill="#51695E" font-family="Arial" font-size="14">Unknown nutrients stay unknown · confirm serving and explicit Save</text>
