<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 770"><rect width="890" height="770" fill="#F6F8F8"/><text x="40" y="52" fill="#246B50" font-family="Arial" font-size="29" font-weight="700">Bloom · Optional Research</text><text x="40" y="82" fill="#5A6D65" font-family="Arial" font-size="15">Illustrative architecture wireframe — not approved consent/legal text</text><rect x="40" y="117" width="810" height="97" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="57" y="146" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Research participation: OFF</text><text x="57" y="172" fill="#51695E" font-family="Arial" font-size="14">Your Everyday and Athlete features work without joining.</text><rect x="40" y="238" width="390" height="105" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="57" y="267" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">What could be shared?</text><text x="57" y="293" fill="#51695E" font-family="Arial" font-size="14">Review categories and exact study purposes</text><rect x="460" y="238" width="390" height="105" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="477" y="267" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Who could receive it?</text><text x="477" y="293" fill="#51695E" font-family="Arial" font-size="14">Study-specific authorized investigators and scope</text><rect x="40" y="360" width="390" height="105" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="57" y="389" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Your choices</text><text x="57" y="415" fill="#51695E" font-family="Arial" font-size="14">Study use, academic sharing, commercial use: separate</text><rect x="460" y="360" width="390" height="105" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="477" y="389" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">AI model training</text><text x="477" y="415" fill="#51695E" font-family="Arial" font-size="14">Separate permission, not included by default</text><rect x="40" y="482" width="810" height="103" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="57" y="511" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Understand withdrawal limits</text><text x="57" y="537" fill="#51695E" font-family="Arial" font-size="14">Future use may stop; already published or exported findings can have limits</text><rect x="40" y="604" width="390" height="105" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="57" y="633" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Not now</text><text x="57" y="659" fill="#51695E" font-family="Arial" font-size="14">Continue using Bloom normally</text><rect x="460" y="604" width="390" height="105" rx="15" fill="#fff" stroke="#D6E5DC"/><text x="477" y="633" fill="#1E4033" font-family="Arial" font-size="19" font-weight="700">Review detailed consent</text><text x="477" y="659" fill="#51695E" font-family="Arial" font-size="14">Only after legal/security and ethics-approved content</text>
