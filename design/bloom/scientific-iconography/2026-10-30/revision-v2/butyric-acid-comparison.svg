<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" role="img" aria-label="Simplified comparison showing butyric acid as CH3 CH2 CH2 COOH, neutral, and butyrate as CH3 CH2 CH2 COO minus, charge negative one."><rect width="620" height="280" rx="22" fill="#F8F8F2"/><text x="26" y="39" font-family="Georgia" font-size="24" fill="#153D2D">Same carbon chain, different chemical form</text><rect x="20" y="64" width="284" height="183" rx="17" fill="#E7EFE8"/><rect x="316" y="64" width="284" height="183" rx="17" fill="#EDEBF5"/><text x="38" y="92" font-family="Arial" font-size="17" font-weight="bold" fill="#174B36">Butyric acid</text><text x="334" y="92" font-family="Arial" font-size="17" font-weight="bold" fill="#4C4974">Butyrate</text><text x="38" y="147" font-family="Arial" font-size="19" fill="#174B36">CH₃–CH₂–CH₂–COOH</text><text x="334" y="147" font-family="Arial" font-size="19" fill="#4C4974">CH₃–CH₂–CH₂–COO⁻</text><text x="38" y="178" font-family="Arial" font-size="14" fill="#4D6858">Neutral acid · PubChem CID 264</text><text x="334" y="178" font-family="Arial" font-size="14" fill="#67637F">Anion (−1) · PubChem CID 104775</text><text x="38" y="220" font-family="Arial" font-size="12" fill="#526A59">Hydrogen on –COOH group</text><text x="334" y="220" font-family="Arial" font-size="12" fill="#67637F">Deprotonated –COO⁻ group</text><text x="24" y="269" font-family="Arial" font-size="11" fill="#687A6B">Scientific review candidate · requires independent chemistry signoff</text></svg>