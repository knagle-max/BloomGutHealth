<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 930" role="img" aria-label="Bloom Science Explorer food design study; not a functioning app"><rect width="390" height="930" fill="#12261E"/><text x="20" y="48" font-family="Georgia" font-size="29" fill="#5D9C78">bloom.</text><text x="18" y="115" fill="#AFC2B6" font-family="Arial" font-size="12" letter-spacing="2">BIOLOGY / RESEARCH EXPLORER</text><text x="18" y="155" fill="#EFF3EB" font-family="Georgia" font-size="27">What may influence it?</text><text x="18" y="185" fill="#AFC2B6" font-family="Arial" font-size="12">Evidence-based explanation · Not a personal toxin measurement</text><rect x="18" y="205" rx="12" width="278" height="36" fill="#2A4E39"/><text x="31" y="229" fill="#EFF3EB" font-family="Arial" font-size="13">Research education · study details available</text><rect x="18" y="270" width="354" height="97" rx="16" fill="#21392B" stroke="#3C5946"/><circle cx="43" cy="299" r="11" fill="#2C805D"/><text x="65" y="301" font-family="Georgia,serif" fill="#EFF3EB" font-size="16">Almonds · human intervention</text><text x="36" y="338" font-family="Arial" fill="#AFC2B6" font-size="12">56.7 g daily · 8 weeks · relative abundance</text><rect x="18" y="380" width="354" height="97" rx="16" fill="#21392B" stroke="#3C5946"/><circle cx="43" cy="409" r="11" fill="#ACCCB7"/><text x="65" y="411" font-family="Georgia,serif" fill="#EFF3EB" font-size="16">Measured endpoint</text><text x="36" y="448" font-family="Arial" fill="#AFC2B6" font-size="12">Overall B. fragilis abundance; not BFT.</text><rect x="18" y="490" width="354" height="97" rx="16" fill="#21392B" stroke="#3C5946"/><circle cx="43" cy="519" r="11" fill="#ACCCB7"/><text x="65" y="521" font-family="Georgia,serif" fill="#EFF3EB" font-size="16">Fermentable fibre</text><text x="36" y="558" font-family="Arial" fill="#AFC2B6" font-size="12">Broader microbiome biology; indirect to toxin.</text><rect x="18" y="600" width="354" height="97" rx="16" fill="#21392B" stroke="#3C5946"/><circle cx="43" cy="629" r="11" fill="#ACCCB7"/><text x="65" y="631" font-family="Georgia,serif" fill="#EFF3EB" font-size="16">What was not tested?</text><text x="36" y="668" font-family="Arial" fill="#AFC2B6" font-size="12">No proof that any food suppresses BFT.</text><text x="18" y="909" fill="#AFC2B6" font-family="Arial" font-size="11">STATIC REFERENCE · SCIENCE REVIEW AND RUNTIME INTEGRATION REQUIRED</text></svg>