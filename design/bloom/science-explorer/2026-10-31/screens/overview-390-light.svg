<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 930" role="img" aria-label="Bloom Science Explorer overview design study; not a functioning app"><rect width="390" height="930" fill="#F9F9F4"/><text x="20" y="48" font-family="Georgia" font-size="29" fill="#5D9C78">bloom.</text><text x="18" y="115" fill="#5F7768" font-family="Arial" font-size="12" letter-spacing="2">BIOLOGY / RESEARCH EXPLORER</text><text x="18" y="155" fill="#193C2C" font-family="Georgia" font-size="27">Bacteroides fragilis</text><text x="18" y="185" fill="#5F7768" font-family="Arial" font-size="12">Evidence-based explanation · Not a personal toxin measurement</text><rect x="18" y="205" rx="12" width="278" height="36" fill="#E2EDE5"/><text x="31" y="229" fill="#193C2C" font-family="Arial" font-size="13">Research education · study details available</text><rect x="18" y="270" width="354" height="97" rx="16" fill="#FFFFFF" stroke="#DFE7DF"/><circle cx="43" cy="299" r="11" fill="#2C805D"/><text x="65" y="301" font-family="Georgia,serif" fill="#193C2C" font-size="16">What does it do?</text><text x="36" y="338" font-family="Arial" fill="#5F7768" font-size="12">Some strains produce BFT, a protein toxin.</text><rect x="18" y="380" width="354" height="97" rx="16" fill="#FFFFFF" stroke="#DFE7DF"/><circle cx="43" cy="409" r="11" fill="#ACCCB7"/><text x="65" y="411" font-family="Georgia,serif" fill="#193C2C" font-size="16">Why does it matter?</text><text x="36" y="448" font-family="Arial" fill="#5F7768" font-size="12">Researchers identified claudin-4 as a receptor.</text><rect x="18" y="490" width="354" height="97" rx="16" fill="#FFFFFF" stroke="#DFE7DF"/><circle cx="43" cy="519" r="11" fill="#ACCCB7"/><text x="65" y="521" font-family="Georgia,serif" fill="#193C2C" font-size="16">What influences it?</text><text x="36" y="558" font-family="Arial" fill="#5F7768" font-size="12">Food evidence is indirect for BFT.</text><rect x="18" y="600" width="354" height="97" rx="16" fill="#FFFFFF" stroke="#DFE7DF"/><circle cx="43" cy="629" r="11" fill="#ACCCB7"/><text x="65" y="631" font-family="Georgia,serif" fill="#193C2C" font-size="16">What does research support?</text><text x="36" y="668" font-family="Arial" fill="#5F7768" font-size="12">See human and mechanistic studies.</text><rect x="18" y="710" width="354" height="97" rx="16" fill="#FFFFFF" stroke="#DFE7DF"/><circle cx="43" cy="739" r="11" fill="#ACCCB7"/><text x="65" y="741" font-family="Georgia,serif" fill="#193C2C" font-size="16">What do my results establish?</text><text x="36" y="778" font-family="Arial" fill="#5F7768" font-size="12">Species detection cannot confirm toxin activity.</text><text x="18" y="909" fill="#5F7768" font-family="Arial" font-size="11">STATIC REFERENCE · SCIENCE REVIEW AND RUNTIME INTEGRATION REQUIRED</text></svg>