<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 790" role="img" aria-label="Bloom Science Explorer overview design study; not a functioning app"><rect width="1160" height="790" fill="#12261E"/><text x="20" y="48" font-family="Georgia" font-size="29" fill="#5D9C78">bloom.</text><rect x="20" y="94" width="225" height="590" rx="21" fill="#21392B"/><text x="45" y="142" fill="#EFF3EB" font-family="Arial" font-size="17">Biology</text><text x="45" y="192" fill="#AFC2B6" font-family="Arial" font-size="16">Organisms</text><text x="45" y="242" fill="#AFC2B6" font-family="Arial" font-size="16">Molecules</text><text x="45" y="292" fill="#AFC2B6" font-family="Arial" font-size="16">Research explorer</text><text x="285" y="115" fill="#AFC2B6" font-family="Arial" font-size="12" letter-spacing="2">BIOLOGY / RESEARCH EXPLORER</text><text x="285" y="155" fill="#EFF3EB" font-family="Georgia" font-size="35">Bacteroides fragilis</text><text x="285" y="185" fill="#AFC2B6" font-family="Arial" font-size="16">Evidence-based explanation · Not a personal toxin measurement</text><rect x="285" y="205" rx="12" width="438" height="36" fill="#2A4E39"/><text x="298" y="229" fill="#EFF3EB" font-family="Arial" font-size="13">Research education · study details available</text><rect x="285" y="235" width="835" height="97" rx="16" fill="#21392B" stroke="#3C5946"/><circle cx="310" cy="264" r="11" fill="#2C805D"/><text x="332" y="266" font-family="Georgia,serif" fill="#EFF3EB" font-size="22">What does it do?</text><text x="303" y="303" font-family="Arial" fill="#AFC2B6" font-size="16">Some strains produce BFT, a protein toxin.</text><rect x="285" y="349" width="835" height="97" rx="16" fill="#21392B" stroke="#3C5946"/><circle cx="310" cy="378" r="11" fill="#ACCCB7"/><text x="332" y="380" font-family="Georgia,serif" fill="#EFF3EB" font-size="22">Why does it matter?</text><text x="303" y="417" font-family="Arial" fill="#AFC2B6" font-size="16">Researchers identified claudin-4 as a receptor.</text><rect x="285" y="463" width="835" height="97" rx="16" fill="#21392B" stroke="#3C5946"/><circle cx="310" cy="492" r="11" fill="#ACCCB7"/><text x="332" y="494" font-family="Georgia,serif" fill="#EFF3EB" font-size="22">What influences it?</text><text x="303" y="531" font-family="Arial" fill="#AFC2B6" font-size="16">Food evidence is indirect for BFT.</text><rect x="285" y="577" width="835" height="97" rx="16" fill="#21392B" stroke="#3C5946"/><circle cx="310" cy="606" r="11" fill="#ACCCB7"/><text x="332" y="608" font-family="Georgia,serif" fill="#EFF3EB" font-size="22">What does research support?</text><text x="303" y="645" font-family="Arial" fill="#AFC2B6" font-size="16">See human and mechanistic studies.</text><rect x="285" y="691" width="835" height="97" rx="16" fill="#21392B" stroke="#3C5946"/><circle cx="310" cy="720" r="11" fill="#ACCCB7"/><text x="332" y="722" font-family="Georgia,serif" fill="#EFF3EB" font-size="22">What do my results establish?</text><text x="303" y="759" font-family="Arial" fill="#AFC2B6" font-size="16">Species detection cannot confirm toxin activity.</text><text x="285" y="769" fill="#AFC2B6" font-family="Arial" font-size="11">STATIC REFERENCE · SCIENCE REVIEW AND RUNTIME INTEGRATION REQUIRED</text></svg>