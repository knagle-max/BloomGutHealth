name: Neon PR database and live app checks

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: neon-pr-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  validate_neon:
    name: Create Neon branch and verify Bloom
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Vitamin D assay and bloodwork browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/lab-explorer-journey.mjs
      - name: Scientific chart density, source dates and four-theme regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          BLOOM_SCIENTIFIC_CHART_SCENARIOS: "1"
        run: node --import tsx scripts/qa/lab-explorer-journey.mjs
      - name: Recorded activity laboratory context and source withdrawal regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          BLOOM_LAB_ACTIVITY_CONTEXT: "1"
        run: node --import tsx scripts/qa/lab-explorer-journey.mjs
      - name: PSA family recognition and assay separation browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/psa-family-journey.mjs
      - name: Standing internal preview scope and revocation browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          BLOOM_STANDING_GRANT_QA: 'true'
        run: node --import tsx scripts/qa/development-photo-journey.mjs
      - name: Remaining-day planner local clock and stale response browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/today-plan-clock-journey.mjs
      - name: Concrete dinner prepared portion review and consumed-save regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/today-dinner-review-journey.mjs
      - name: Practical and Athlete prepared meal transfer browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/planned-meal-transfer-journey.mjs
      - name: Source-scoped morphology thumbnails and portraits browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/morphology-artwork-journey.mjs
      - name: Biology source banners and original destination browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/biology-landing-journey.mjs
      - name: Bloodwork atlas source navigation and reserved media browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/bloodwork-atlas-journey.mjs
      - name: Whole-panel source review browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/lab-panel-review-journey.mjs
      - name: Remembered laboratory context source and privacy browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/lab-remembered-context-journey.mjs
      - name: Reviewed laboratory source persistence browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/lab-source-review-journey.mjs
      - name: Default source-only bloodwork preservation browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/source-only-lab-journey.mjs
      - name: Dated bloodwork panel and row duplicate decisions browser regression
        timeout-minutes: 6
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/lab-dated-panel-journey.mjs
      - name: Report-scoped reference matching browser regression
        timeout-minutes: 5
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/report-range-overlay-journey.mjs
      - name: Saved laboratory provider and reference management browser regression
        timeout-minutes: 8
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/lab-report-management-journey.mjs
      - name: Saved nutrient source and contribution browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/private-source-context-journey.mjs
      - name: Saved wellness choices and food source context browser regression
        timeout-minutes: 6
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/wellness-choice-journey.mjs
      - name: Source-dated experiment comparison browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/experiment-history-journey.mjs
      - name: Source-scoped actual steps and existing activity lifecycle browser regression
        timeout-minutes: 5
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: |
          node --import tsx scripts/qa/activity-log-journey.mjs
          node --import tsx scripts/qa/activity-mixed-description-journey.mjs
          node --import tsx scripts/qa/activity-routines-journey.mjs
      - name: Owned genetics recorded filter and source lifecycle browser regression
        timeout-minutes: 5
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: |
          node --import tsx scripts/qa/genetic-source-management-journey.mjs
          node --import tsx scripts/qa/selected-genetics-journey.mjs
      - name: Food journal editorial and saved meal no-regression browser checks
        timeout-minutes: 6
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: |
          node --import tsx scripts/qa/food-journal-editorial-journey.mjs
          node --import tsx scripts/qa/unified-meal-editor-journey.mjs
          node scripts/qa/journal-current-context-journey.mjs
          node scripts/qa/saved-template-retry-journey.mjs
          node --import tsx scripts/qa/saved-meal-review-journey.mjs
      - name: Public account entry theme and session browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/auth-form-ux-journey.mjs
      - name: Report control reflow and native PDF privacy browser regression
        timeout-minutes: 4
        env:
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node --import tsx scripts/qa/viome-pdf-journey.mjs
      - name: Python service authentication and evidence contracts
        run: |
          python3 -m venv /tmp/bloom-service-tests
          /tmp/bloom-service-tests/bin/pip install -r requirements-test.txt
          /tmp/bloom-service-tests/bin/python -m unittest discover -s tests -p 'test_*.py'
          BLOOM_PYTHON=/tmp/bloom-service-tests/bin/python node --import tsx scripts/qa/synthetic-molecular-http.mjs
      - name: Set preview branch expiry
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create isolated schema-only Neon branch
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview/pr-${{ github.event.number }}
          parent_branch: production
          branch_type: schema-only
          expires_at: ${{ env.EXPIRES_AT }}
      - name: Apply Neon service configuration and pull environment
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH: preview/pr-${{ github.event.number }}
        # Pin:8.14.0 requests unpublished @neon/config1.9.6 and fails before app checks.
        run: |
          npx --yes neon@8.13.0 --no-analytics link -y --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH" --no-env-pull
          npx --yes neon@8.13.0 --no-analytics deploy
      - name: Apply app schema to preview database only
        env:
          BLOOM_SMOKE_ISOLATED: "true"
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: |
          node scripts/prepare-preview-schema.mjs
          node scripts/push-preview-schema.mjs
          npm run db:seed:knowledge
          node --import tsx scripts/verify-preview-schema.ts --before-app-start
      - name: Type check and API source inventory
        run: |
          npm run check
          node --import tsx scripts/api-exposure-inventory.ts --check
          node --import tsx scripts/capability-crosswalk.ts --check
          node --import tsx scripts/biology-content-coverage.ts --check
      - name: Verify exact isolated hosted review persistence
        timeout-minutes: 5
        env:
          BLOOM_HOSTED_RC_ISOLATED: "true"
          BLOOM_HOSTED_RC_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: node --import tsx scripts/qa/hosted-rc-persistence.mjs
      - name: Unit and embedded PostgreSQL tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify Render public M1 image responses
        timeout-minutes: 4
        run: node scripts/verify-r4-m1-media.mjs --built --http https://bloomguthealth.onrender.com/
      - name: Verify deployed navigation, media recovery and responsive layout
        timeout-minutes: 8
        env:
          BLOOM_M1: "1"
          BLOOM_MEDIA_FALLBACK_CHECK: "1"
          BLOOM_NAVIGATION_CHECK: "1"
          BLOOM_UI_SHELL_TARGETS: "1"
          BLOOM_M1_BASE_URL: https://bloomguthealth.onrender.com
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          BLOOM_MATERIAL_REVIEW: /tmp/bloom-m1-hosted-browser
        run: node --import tsx scripts/qa/visual-materials-parity.mjs
      - name: Verify Biology original public image bytes
        timeout-minutes: 4
        env:
          BLOOM_BIOLOGY_MEDIA_BASE_URL: https://bloomguthealth.onrender.com
        run: |
          node --import tsx scripts/verify-biology-media.ts --built
          node --import tsx scripts/verify-ready-editorial-media.ts --built
          node scripts/verify-morphology-media.mjs --built
      - name: Verify deployed Biology image contrast, navigation and source recovery
        timeout-minutes: 4
        env:
          BLOOM_BIOLOGY_BASE_URL: https://bloomguthealth.onrender.com
          BLOOM_PLAYWRIGHT_MODULE: playwright-core
          BLOOM_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          BLOOM_BIOLOGY_REVIEW: /tmp/bloom-biology-hosted/
          BLOOM_CAPTURE_VISUALS: '1'
        run: node --import tsx scripts/qa/biology-landing-journey.mjs
      - name: Start production app and verify live Neon persistence
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          BLOOM_SMOKE_ISOLATED: "true"
        run: |
          npm run test:neon
          node --import tsx scripts/verify-preview-schema.ts
          node --import tsx scripts/spend-ledger-smoke.ts
          node --import tsx scripts/feature-control-smoke.ts

  delete_neon_branch:
    name: Delete Neon PR database
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete this pull request's preview branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview/pr-${{ github.event.number }}
